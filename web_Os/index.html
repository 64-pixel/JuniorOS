<!DOCTYPE html>
<html lang="cs">
  <head>
      <meta charset="UTF-8">
      <title>My OS</title>
      <link rel="stylesheet" href="style.css">
      <style>
      body {
        margin: 0;
        overflow: hidden;
        background-color: rgb(0, 0, 0);
        font-family: Arial, sans-serif;
      }
      /* Makes the canvas sit full-screen behind your text */
      #fireworks {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1; /* Puts canvas in the background */
        display: block;
      }
      /* Puts your interactive text elements on top of the fireworks */
      #mydiv, .taskbar {
        position: relative;
        z-index: 2; 
      }
      </style>
  </head>

  <body>
    <!-- The canvas background -->
     <canvas id="fireworks"></canvas>
  

    <!-- Content Layer -->
    <div id="mydiv">
          <div id="mydivheader" style="position: absolute; top:50vh; left:50%; transform: translate(-50%, -50%); align-items: center; text-align:center; color:rgb(54, 185, 54); width: 100%;">
              <h1 style="color: aqua;">
                  Welcome to my <strong id="osButton" style="cursor:pointer;">OS</strong>
              </h1>
              <p>My name is <strong id="myName" style="color: #0E91DD; cursor: pointer;">Daniel</strong> and today I will walk you through my OS.</p>
              <div class="socials" id="socials">
                  <p>My socials:</p>
                  <nav>
                      <a href="https://www.instagram.com/direct/t/103755687694980/" style="color: #BE392D;">Instagram</a>
                      <br>
                      <a href="https://www.facebook.com/" style="color: #BE392D;">Facebook</a>
                      <br>
                      <a href="https://x.com/" style="color: #BE392D;">Twitter</a>
                  </nav>
              </div>
          </div>
    </div>

    <!-- Bottom Taskbar Layout fixed to the bottom of the viewport -->
    <div class="taskbar" style="position: fixed; bottom: 0; left: 0; right: 0; display:flex; justify-content: space-around ;align-items:center ;background-color: rgba(0,0,0,0.25); color:#fff; backdrop-filter:blur(50px); height: 50px;">
      <p style="margin-left:16px;">JuniorOS</p>
      <p id="timeElement" style="margin-right:16px;">Loading Time...</p>
      <p style="margin-inline: 32px; ">Version 1.0</p>
    </div>

    <!-- JavaScript logic loaded correctly at the end -->
    <script>
      function updateTime(){
        var TimeNow = new Date().toLocaleString();
        var timeText = document.querySelector("#timeElement");
        if(timeText) {
          timeText.innerHTML = TimeNow;
        }
      }
      updateTime(); // Run instantly on load
      setInterval(updateTime, 1000);
    </script>
    <script src="script.js" defer></script>
    <script src="fireworks.js" defer></script>
    
  </body>
</html>
